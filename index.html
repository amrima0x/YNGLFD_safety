<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yanbu Area 2026 Safety Campaign — Registration</title>
<meta name="description" content="Register for the Yanbu Area 2026 Safety Campaign — Close The Gap, Sustain The Barrier, Or It Comes Back.">
<meta name="theme-color" content="#0033A0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f5; --card:#ffffff; --tint:#eef6fc; --line:#DADADA;
  --ink:#676A6E; --muted:#676A6E; --dim:#808080;
  --navy:#0033A0; --blue:#00A3E0; --green:#84BD00; --dgreen:#00843D; --red:#d6334a; --warn:#e88a00;
  --grad:linear-gradient(120deg,#0033A0 0%,#0072CE 40%,#00A3E0 68%,#84BD00 100%);
  --r:18px;
  --display:"Manifa Pro 2","Manifa Pro2","ManifaPro2","Manifa","Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"Manifa Pro 2","Manifa Pro2","ManifaPro2","Manifa","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{width:44px;height:44px;border-radius:11px;object-fit:cover;display:block;flex:none;box-shadow:0 4px 12px -4px rgba(0,51,160,.35)}
.dept{font-size:13px;color:var(--muted);line-height:1.25;flex:1;min-width:0;text-align:left}
.dept b{display:block;color:var(--navy);font-weight:700;font-size:14px}
.lang{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;flex:none}
.lang:hover{border-color:var(--blue)}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;background:var(--grad);padding:30px 22px 26px;isolation:isolate;color:#fff;box-shadow:0 18px 40px -22px rgba(0,51,160,.6)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(520px 280px at 88% 10%,rgba(255,255,255,.22),transparent 60%),linear-gradient(180deg,transparent 50%,rgba(0,30,90,.28));z-index:-1}
.bracket{position:absolute;inset:18px auto auto 16px;width:150px;height:auto;opacity:.95}
.theme{position:relative;text-align:left;padding:36px 0 0 54px;font-family:var(--display);font-weight:800;font-size:clamp(24px,6.6vw,38px);line-height:1.15;letter-spacing:-.3px;text-shadow:0 2px 16px rgba(0,20,70,.25)}
.theme span{display:block}
.eyebrow{margin-top:24px;display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:999px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#c6f05a;box-shadow:0 0 0 4px rgba(198,240,90,.25)}
.title{margin-top:10px;font-family:var(--display);font-weight:800;font-size:clamp(22px,5.6vw,32px);line-height:1.2}
.meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:rgba(255,255,255,.95)}
.meta div{display:flex;align-items:center;gap:7px}
.meta svg{width:17px;height:17px;opacity:.9;flex:none}

/* sections */
.sec{margin-top:26px}
.h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.step{font-family:var(--display);font-weight:800;font-size:14px;color:var(--blue);letter-spacing:.06em}
.h h2{font-size:19px;font-weight:700;color:var(--navy)}

/* day cards */
.days{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.day{position:relative;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden;box-shadow:0 6px 18px -12px rgba(0,51,160,.25)}
.day:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px)}
.day.sel{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,163,224,.16),0 10px 24px -14px rgba(0,51,160,.4)}
.day:disabled{cursor:not-allowed}
.dow{font-size:13px;color:var(--muted);font-weight:500}
.dnum{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;margin-top:4px;color:var(--navy)}
.dmon{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;color:var(--blue)}
.seats{margin-top:12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.seats b{color:var(--ink);font-weight:700}
.bar{margin-top:7px;height:6px;border-radius:9px;background:#DADADA;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .6s ease}
.day.low .bar i{background:linear-gradient(90deg,#f5a623,var(--warn))}
.check{position:absolute;top:12px;inset-inline-end:12px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:.15s;background:#fff}
.day.sel .check{background:var(--blue);border-color:var(--blue)}
.check svg{width:14px;height:14px;opacity:0}
.day.sel .check svg{opacity:1}
.stamp{position:absolute;inset:0;display:none;place-items:center;background:rgba(255,255,255,.78);backdrop-filter:blur(1.5px)}
.day.full .stamp,.day.closed .stamp{display:grid}
.stamp span{transform:rotate(-9deg);border:3px solid var(--red);color:var(--red);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em;padding:4px 12px;border-radius:8px;text-transform:uppercase;text-align:center;line-height:1.2;background:#fff}
.day.closed .stamp span{border-color:var(--dim);color:var(--muted)}
.loading .dnum,.loading .seats{opacity:.5}

/* form */
.formcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;box-shadow:0 10px 30px -20px rgba(0,51,160,.3)}
.chosen{display:flex;align-items:center;gap:10px;background:var(--tint);border:1px solid #cfe8f6;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:16px;color:var(--navy)}
.chosen b{font-weight:700}
.chosen button{margin-inline-start:auto;background:none;border:0;color:var(--blue);cursor:pointer;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.field{margin-bottom:14px}
.field label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field label em{font-style:normal;color:var(--dim);font-weight:400;font-size:13px}
.field input{width:100%;background:#fbfcfe;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:#C0C0C0}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,163,224,.14);background:#fff}
.field.err input{border-color:var(--red)}
.field .msg{display:none;color:var(--red);font-size:13px;margin-top:5px}
.field.err .msg{display:block}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;box-shadow:0 12px 28px -12px rgba(0,51,160,.6);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none;font-size:15px;padding:13px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:none}
.btn.busy .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.alert{display:none;margin-bottom:14px;border-radius:12px;padding:12px 14px;font-size:14px;background:#fdecee;border:1px solid #f5c2c9;color:#a3192d}
.alert.show{display:block}
.privacy{margin-top:12px;font-size:12.5px;color:var(--dim);text-align:center}

/* success */
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px 20px;text-align:center;overflow:hidden;box-shadow:0 18px 40px -24px rgba(0,51,160,.45)}
.ticket::before,.ticket::after{content:"";position:absolute;top:58%;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{left:-14px}.ticket::after{right:-14px}
.okc{width:66px;height:66px;margin:0 auto;border-radius:50%;background:rgba(132,189,0,.15);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.okc svg{width:34px;height:34px}
.okc svg path{stroke:var(--dgreen)}
.okc path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .25s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.ticket h2{margin-top:14px;font-size:22px;font-weight:800;color:var(--navy);font-family:var(--display)}
.ticket p.sub{color:var(--muted);font-size:14px;margin-top:4px}
.tear{margin:20px -20px 16px;border-top:2px dashed var(--line)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;text-align:start}
.tgrid div span{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
[dir=rtl] .tgrid div span{letter-spacing:0}
.tgrid div b{display:block;font-weight:700;font-size:15px;word-break:break-word;color:var(--ink)}
.seatno{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:var(--tint);border-radius:12px;padding:10px 14px}
.seatno b{font-family:var(--display);font-size:28px!important;color:var(--navy)}
.actions{display:grid;gap:10px;margin-top:16px}

/* about */
.about{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}
.about p{color:var(--muted);font-size:14.5px}
.agenda{margin-top:16px;display:flex;align-items:center;gap:14px;padding:16px 16px;border-radius:16px;background:var(--grad);color:#fff;text-decoration:none;box-shadow:0 14px 30px -16px rgba(0,51,160,.7);transition:transform .15s,filter .15s}
.agenda:hover{filter:brightness(1.06);transform:translateY(-2px)}
.agenda:active{transform:scale(.99)}
.ag-ic{flex:none;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.ag-ic svg{width:24px;height:24px}
.ag-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ag-tx b{font-family:var(--display);font-weight:700;font-size:17px}
.ag-tx small{font-size:13px;opacity:.85}
.ag-ar{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center}
.ag-ar svg{width:18px;height:18px}
[dir=rtl] .ag-ar svg{transform:scaleX(-1)}
footer{margin:30px 0 40px;text-align:center;font-size:12.5px;color:var(--dim)}
footer b{color:var(--muted);font-weight:600}
.demo{position:sticky;top:0;z-index:5;background:#fff4dc;color:#7a4b00;font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #f3d9a4}
.hide{display:none!important}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
@media (max-width:420px){.dnum{font-size:42px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="demo" class="demo hide"></div>

<div class="wrap">
  <header class="top" dir="ltr">
    <div class="dept"><b>Yanbu NGL Fractionation Department</b><span data-t="deptSub"></span></div>
    <button class="lang" id="langBtn" type="button">عربي</button>
    <img class="logo" src="assets/logo.png" alt="Saudi Aramco" onerror="this.remove()">
  </header>

  <section class="hero">
    <svg class="bracket" viewBox="0 0 150 120" fill="none" aria-hidden="true">
      <path d="M4 4H146L104 40H32V82L8 110Z" stroke="#fff" stroke-width="5" stroke-linejoin="miter"/>
    </svg>
    <div class="theme" dir="ltr"><span>Close The Gap</span><span>Sustain The Barrier</span><span>Or It Comes Back</span></div>
    <div class="eyebrow"><i></i><span data-t="eyebrow"></span></div>
    <h1 class="title" data-t="title"></h1>
    <div class="meta">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="dates"></span></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="timeTxt"></span></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span data-t="venue"></span></div>
    </div>
  </section>

  <!-- STEP 1 + 2 -->
  <div id="flow">
    <section class="sec">
      <div class="h"><span class="step">01</span><h2 data-t="chooseDay"></h2></div>
      <div class="days loading" id="days"></div>
    </section>

    <section class="sec hide" id="formSec">
      <div class="h"><span class="step">02</span><h2 data-t="yourDetails"></h2></div>
      <form class="formcard" id="form" novalidate autocomplete="on">
        <div class="chosen"><span data-t="attending"></span>&nbsp;<b id="chosenTxt"></b><button type="button" id="changeDay" data-t="change"></button></div>
        <div class="alert" id="alert" role="alert"></div>
        <div class="field" data-f="name">
          <label for="name"><span data-t="fName"></span></label>
          <input id="name" name="name" autocomplete="name" maxlength="80" data-ph="phName">
          <div class="msg" data-t="eName"></div>
        </div>
        <div class="field" data-f="empId">
          <label for="empId"><span data-t="fId"></span></label>
          <input id="empId" name="empId" inputmode="text" autocapitalize="characters" maxlength="20" data-ph="phId">
          <div class="msg" data-t="eId"></div>
        </div>
        <div class="field" data-f="company">
          <label for="company"><span data-t="fCompany"></span></label>
          <input id="company" name="company" list="companyList" autocomplete="organization" maxlength="80" data-ph="phCompany">
          <datalist id="companyList"></datalist>
          <div class="msg" data-t="eCompany"></div>
        </div>
        <div class="field" data-f="email">
          <label for="email"><span data-t="fEmail"></span><em data-t="optional"></em></label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" data-ph="phEmail">
          <div class="msg" data-t="eEmail"></div>
        </div>
        <button class="btn" id="submitBtn" type="submit"><span class="spin"></span><span data-t="register"></span></button>
        <p class="privacy" data-t="privacy"></p>
      </form>
    </section>
  </div>

  <!-- STEP 3 -->
  <section class="sec hide" id="doneSec">
    <div class="ticket fade">
      <div class="okc"><svg viewBox="0 0 24 24" fill="none" stroke="#00843D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 data-t="doneTitle"></h2>
      <p class="sub" data-t="doneSub"></p>
      <div class="tear"></div>
      <div class="tgrid">
        <div><span data-t="lName"></span><b id="tName"></b></div>
        <div><span data-t="lId"></span><b id="tId" dir="ltr"></b></div>
        <div><span data-t="lCompany"></span><b id="tCompany"></b></div>
        <div><span data-t="lDay"></span><b id="tDay"></b></div>
        <div class="seatno"><span data-t="lSeat"></span><b id="tSeat" dir="ltr"></b></div>
      </div>
      <div class="actions">
        <button class="btn" id="calBtn" type="button" data-t="addCal"></button>
        <button class="btn ghost" id="againBtn" type="button" data-t="another"></button>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="about">
      <div class="h" style="margin-bottom:8px"><h2 data-t="aboutH"></h2></div>
      <p data-t="aboutP"></p>
      <a class="agenda" href="https://drive.google.com/file/d/1lfCdN8brFrl1iyBR4aSw6Rb-OYCVeQXM/view?usp=sharing" target="_blank" rel="noopener">
        <span class="ag-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span>
        <span class="ag-tx"><b data-t="agendaBtn"></b><small data-t="agendaSub"></small></span>
        <span class="ag-ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
      </a>
    </div>
  </section>

  <footer><span data-t="orgBy"></span><br><b>Yanbu NGL Fractionation Department</b> · <b>Western Region Area Loss Prevention</b></footer>
</div>

<script src="config.js"></script>
<script src="store.js"></script>

  doneTitle:"تم تسجيلك بنجاح!",doneSub:"نشوفك في حملة السلامة. اعرض هذه الشاشة عند الدخول إذا طُلب منك.",
  lName:"الاسم",lId:"الرقم الوظيفي",lCompany:"الشركة",lDay:"اليوم",lSeat:"رقم التسجيل",addCal:"أضف إلى التقويم",another:"تسجيل شخص آخر",
  errFull:"عذراً، اكتمل العدد لهذا اليوم للتو. اختر اليوم الآخر.",errClosed:"التسجيل لهذا اليوم مغلق.",errDup:"هذا الرقم الوظيفي مسجّل مسبقاً في الحملة.",errNet:"مشكلة في الاتصال. تأكد من الإنترنت وحاول مرة ثانية.",errBusy:"فيه ضغط تسجيل الحين، اضغط تسجيل مرة ثانية.",
  aboutH:"عن الحملة",aboutP:"تهدف الحملة لرفع الوعي واليقظة تجاه مخاطر المناطق الخطرة، وسلامة العمليات، وتطبيع الانحرافات، مع معرض لأفضل ممارسات السلامة من جميع مرافق التشغيل والمشاريع المشتركة في منطقة ينبع.",
  agendaBtn:"اضغط هنا لعرض الأجندة",agendaSub:"البرنامج كامل · PDF",
  orgBy:"تنظيم",demo:"وضع التجربة — التسجيلات محفوظة على هذا الجهاز فقط. أضف إعدادات Firebase في config.js للتشغيل الفعلي."}
};
let lang = "en"; try{ lang = localStorage.getItem("sc_lang") || (navigator.language||"").startsWith("ar") && "ar" || "en"; }catch(e){}
let store, pub = {counts:{},settings:{}}, sel = null, last = null;
const $ = s => document.querySelector(s);
const t = k => T[lang][k];

function dayInfo(d){
  const dt = new Date(d.date+"T12:00:00+03:00");
  const loc = lang==="ar" ? "ar-SA-u-nu-latn-ca-gregory" : "en-GB";
  return { dow: dt.toLocaleDateString(loc,{weekday:"long",timeZone:"Asia/Riyadh"}),
           num: dt.getUTCDate(), mon: dt.toLocaleDateString(loc,{month:"short",timeZone:"Asia/Riyadh"}).toUpperCase(),
           long: dt.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Riyadh"}) };
}
function status(id){
  const n = (pub.counts[id]&&pub.counts[id].n)||0;
  const paused = pub.settings[id] && pub.settings[id].open===false;
  const closed = Store.isPast(id) || paused;
  return {n, left:Math.max(0,CAP-n), full:n>=CAP, closed, paused};
}
function renderDays(){
  const box = $("#days"); box.innerHTML = "";
  C.days.forEach(d=>{
    const s = status(d.id), di = dayInfo(d);
    const b = document.createElement("button");
    b.type="button"; b.className="day"; b.dataset.id=d.id;
    if(s.full) b.classList.add("full"); else if(s.closed) b.classList.add("closed");
    if(!s.full && !s.closed && s.left<=15) b.classList.add("low");
    if(sel===d.id) b.classList.add("sel");
    b.disabled = s.full || s.closed;
    const stampTxt = s.full ? t("full") : (s.paused ? t("paused") : t("closed"));
    b.innerHTML = `<span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <div class="dow">${di.dow}</div><div class="dnum">${di.num}</div><div class="dmon">${di.mon} 2026</div>
      <div class="seats"><span>${s.left<=15&&s.left>0 ? t("lastSeats")(s.left) : t("seatsLeft")(s.left)}</span><span dir="ltr">${t("seatsOf")(s.n)}</span></div>
      <div class="bar"><i style="width:${Math.min(100,s.n/CAP*100)}%"></i></div>
      <div class="stamp"><span>${stampTxt}</span></div>`;
    b.onclick = ()=>choose(d.id);
    box.appendChild(b);
  });
  if(sel){ const s=status(sel); if(s.full||s.closed){ sel=null; $("#formSec").classList.add("hide"); } }
}
function choose(id){
  sel = id; renderDays();
  $("#chosenTxt").textContent = dayInfo(C.days.find(d=>d.id===id)).long;
  const f = $("#formSec"); const wasHidden = f.classList.contains("hide");
  f.classList.remove("hide"); f.classList.add("fade"); hideAlert();
  if(wasHidden){ setTimeout(()=>{ f.scrollIntoView({behavior:"smooth",block:"start"}); setTimeout(()=>$("#name").focus({preventScroll:true}),450); },60); }
}
function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=t(el.dataset.t); if(typeof v==="string") el.textContent=v; });
  document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t(el.dataset.ph));
  $("#timeTxt").textContent = C.time[lang];
  $("#langBtn").textContent = lang==="ar" ? "English" : "عربي";
  if(store && store.mode==="demo") $("#demo").textContent = t("demo");
  renderDays();
  if(sel) $("#chosenTxt").textContent = dayInfo(C.days.find(d=>d.id===sel)).long;
  if(last) fillTicket();
}
$("#langBtn").onclick = ()=>{ lang = lang==="ar"?"en":"ar"; try{localStorage.setItem("sc_lang",lang)}catch(e){} applyLang(); };
$("#changeDay").onclick = ()=>{ $("#days").scrollIntoView({behavior:"smooth",block:"center"}); };
$("#companyList").innerHTML = C.companies.map(c=>`<option value="${c}">`).join("");

function showAlert(m){ const a=$("#alert"); a.textContent=m; a.classList.add("show"); a.scrollIntoView({behavior:"smooth",block:"center"}); }
function hideAlert(){ $("#alert").classList.remove("show"); }
function setErr(f,on){ document.querySelector(`[data-f="${f}"]`).classList.toggle("err",on); }
["name","empId","company","email"].forEach(f=>$("#"+f).addEventListener("input",()=>setErr(f,false)));
$("#empId").addEventListener("input",e=>{ const v=e.target.value.toUpperCase().replace(/\s/g,""); if(v!==e.target.value) e.target.value=v; });

$("#form").addEventListener("submit", async e=>{
  e.preventDefault(); hideAlert();
  if(!sel) return;
  const v = { name:$("#name").value.trim().replace(/\s+/g," "), empId:Store.cleanId($("#empId").value),
              company:$("#company").value.trim().replace(/\s+/g," "), email:$("#email").value.trim().toLowerCase(), lang };
  const bad = { name:v.name.length<2, empId:!/^[A-Z0-9-]{2,20}$/.test(v.empId) || $("#empId").value.trim().length!==v.empId.length,
                company:v.company.length<2, email: v.email!=="" && !/^[^@ ]+@[^@ ]+\.[^@ ]+$/.test(v.email) };
  Object.keys(bad).forEach(k=>setErr(k,bad[k]));
  const first = Object.keys(bad).find(k=>bad[k]); if(first){ $("#"+first).focus(); return; }
  const btn = $("#submitBtn"); btn.disabled=true; btn.classList.add("busy");
  let r; try{ r = await store.register(sel, v); }catch(err){ r={ok:false,reason:"network"}; }
  btn.disabled=false; btn.classList.remove("busy");
  if(r.ok){ last = {...v, day:sel, seat:r.seat}; fillTicket(); $("#flow").classList.add("hide"); $("#doneSec").classList.remove("hide"); window.scrollTo({top:0,behavior:"smooth"}); }
  else showAlert({full:t("errFull"),closed:t("errClosed"),duplicate:t("errDup"),busy:t("errBusy")}[r.reason] || t("errNet"));
});
function fillTicket(){
  $("#tName").textContent=last.name; $("#tId").textContent=last.empId; $("#tCompany").textContent=last.company;
  $("#tDay").textContent=dayInfo(C.days.find(d=>d.id===last.day)).long; $("#tSeat").textContent="#"+String(last.seat).padStart(3,"0");
}
$("#againBtn").onclick = ()=>{ last=null; sel=null; $("#form").reset(); $("#doneSec").classList.add("hide"); $("#flow").classList.remove("hide"); $("#formSec").classList.add("hide"); renderDays(); window.scrollTo({top:0,behavior:"smooth"}); };
$("#calBtn").onclick = ()=>{
  const d = C.days.find(x=>x.id===last.day).date.replace(/-/g,"");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//YNGLFD//Safety Campaign//EN","BEGIN:VEVENT",
    "UID:"+last.day+"-"+last.empId+"@ynglfd-safety","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z",
    "DTSTART;TZID=Asia/Riyadh:"+d+"T073000","DTEND;TZID=Asia/Riyadh:"+d+"T130000",
    "SUMMARY:Yanbu Area 2026 Safety Campaign","LOCATION:"+C.location.replace(/,/g,"\\,"),
    "DESCRIPTION:Close The Gap\\, Sustain The Barrier\\, Or It Comes Back. Organized by "+C.organizer+".","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="Safety-Campaign-2026.ics"; a.click();
};

applyLang();
Store.init().then(s=>{
  store = s;
  if(s.mode==="demo"){ $("#demo").textContent=t("demo"); $("#demo").classList.remove("hide"); }
  s.watchPublic(p=>{ pub=p; $("#days").classList.remove("loading"); renderDays(); }, ()=>{ $("#days").classList.remove("loading"); });
}).catch(()=>{ showAlert(t("errNet")); });
setInterval(renderDays, 60000);
})();
</script>
</body>
</html>
